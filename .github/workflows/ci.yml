name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # Build-time placeholders: CI never talks to the real backend.
  VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
  VITE_APP_VERSION: ${{ github.sha }}

jobs:
  web:
    name: Web · lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: dist
          retention-days: 7

  database:
    name: Database · migrations + RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v5
      - run: bash supabase/tests/run.sh ci_migrations

  api:
    name: API · integration tests (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # aws: fresh DB from `prisma migrate deploy` + self-hosted auth
        # supabase: Supabase-shaped DB (SQL migrations, RLS, triggers) baselined for Prisma + Supabase JWTs
        flavor: [aws, supabase]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB_FLAVOR: ${{ matrix.flavor }}
      TEST_PG_URL: postgresql://postgres@localhost:5432
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Migrations match the Prisma schema (no drift)
        if: matrix.flavor == 'aws'
        run: |
          psql -h localhost -U postgres -c "create database drift_check"
          DIRECT_URL=postgresql://postgres@localhost:5432/drift_check npx prisma migrate deploy
          DIRECT_URL=postgresql://postgres@localhost:5432/drift_check npx prisma migrate diff \
            --from-config-datasource --to-schema server/prisma/schema.prisma --exit-code
      - run: npm run test:api

  api-image:
    name: API · Docker image
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t illuxus-venues-api:${{ github.sha }} .
      - name: Boots, refuses bad config, answers health
        run: |
          ! docker run --rm illuxus-venues-api:${{ github.sha }}
          docker run -d --name api -p 8787:8787 -e DATABASE_URL=postgresql://none@127.0.0.1:1/none \
            -e AUTH_PROVIDER=local -e JWT_SECRET=ci-only-0123456789abcdef0123456789abcdef \
            illuxus-venues-api:${{ github.sha }}
          for i in $(seq 1 20); do curl -fs localhost:8787/api/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8787/api/ready)" = "503"
          docker stop api

  android:
    name: Android · debug APK + lint
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          # The action's default list includes the removed "tools" package,
          # which makes current sdkmanager (cmdline-tools 16+) fail.
          packages: "platform-tools platforms;android-36"
      - run: npm ci
      - run: npm run cap:sync
      - name: Build debug APK and run Android lint
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v5
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  android-release:
    name: Android · signed release bundle
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_ILLUXUS_ORIGIN: ${{ vars.VITE_ILLUXUS_ORIGIN }}
      VITE_VENDOR_ALLOWED_EMAILS: ${{ vars.VITE_VENDOR_ALLOWED_EMAILS }}
      VITE_ERROR_REPORT_URL: ${{ vars.VITE_ERROR_REPORT_URL }}
      VITE_APP_VERSION: ${{ github.ref_name }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          # The action's default list includes the removed "tools" package,
          # which makes current sdkmanager (cmdline-tools 16+) fail.
          packages: "platform-tools platforms;android-36"
      - name: Restore upload keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$ANDROID_KEYSTORE_PATH"
      - run: npm ci
      - run: npm run cap:sync
      - working-directory: android
        run: ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v5
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

  ios:
    name: iOS · simulator build
    needs: web
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run cap:sync
      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
