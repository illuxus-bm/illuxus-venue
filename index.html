<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <title>Illuxus Venues — Book the right venue for your event</title>
    <meta
      name="description"
      content="Venues for conferences, launches, weddings and meetups, shown only when they are free on your event dates in your city. Book them with add-on services through Illuxus."
    />
    <!-- Same type as illuxus: Onest for the UI, Bebas Neue for poster headlines. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Bebas+Neue&family=Poppins:wght@400;500;600;700;800&display=swap"
    />
  </head>
  <body>
    <!-- Apply the saved theme before React renders, so the page never flashes
         the wrong one. Same storage key as illuxus ("app-theme"). -->
    <script>
      (function () {
        var s = null;
        try { s = localStorage.getItem("app-theme"); } catch (e) {}
        var t = s === "dark" || s === "light" ? s :
          (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        if (t === "dark") document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = t;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
